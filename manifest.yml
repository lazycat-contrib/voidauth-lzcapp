name: VoidAuth
package: lazycat.community.app.voidauth
version: 1.1.0
min_os_version: 1.3.8
description: Single Sign-On for Your Self-Hosted Universe
homepage: https://github.com/voidauth/voidauth
author: voidauth
application:
    subdomain: voidauth
    background_task: true
    public_path:
        - /

    upstreams:
        - location: /
          backend: http://voidauth:3000

services:
    voidauth:
        # ghcr.io/voidauth/voidauth:1.1.0
        container_name: voidauth
        image: registry.lazycat.cloud/czyt/voidauth/voidauth:46640ab103a4de1d
        environment:
{{if .U.enable_custom_domain}}
            - APP_URL=https://{{.U.custom_domain}}
{{else}}
            - APP_URL=https://{{.S.AppDomain}}
{{end}}
            - STORAGE_KEY={{ stable_secret "salt-key-base"  }}
            - DB_PASSWORD=voidauth#se
            - DB_HOST=voidauth-pg-db
        binds:
            - /lzcapp/var/config:/app/config
        depends_on:
            - voidauth-pg-db

    voidauth-pg-db:
        container_name: voidauth-pg-db
        image: registry.lazycat.cloud/czyt/library/postgres:0b2fd10c34119f60
        environment:
            - POSTGRES_PASSWORD=voidauth#se
        bind:
            - /lzcapp/var/db:/var/lib/postgresql/data
        health_check:
            test:
                - CMD-SHELL
                - pg_isready -U postgres
            start_period: 90s
